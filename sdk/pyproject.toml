[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenai-tracker"
version = "0.1.3"
description = "Track carbon footprint of ML training jobs — 3 lines of code"
authors = [{ name = "GreenAI", email = "support@greenai.dev" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["carbon", "emissions", "machine-learning", "sustainability", "green-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=11.0.0"]
cpuinfo = ["py-cpuinfo>=9.0.0"]
full = ["nvidia-ml-py>=11.0.0", "py-cpuinfo>=9.0.0"]

[project.scripts]
greenai-tracker = "greenai_sdk.cli:main"

[project.urls]
Homepage = "https://greenai.dev"
Documentation = "https://docs.greenai.dev"
Repository = "https://github.com/greenai/greenai-python"
Issues = "https://github.com/greenai/greenai-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["greenai*", "greenai_sdk*"]
